[package]
name = "portmap"
version = "0.1.0"
edition = "2021"
description = "Bookmarks for everything listening on localhost: auto-discovered, live, with thumbnails."
license = "MIT"
repository = "https://github.com/RakshithBhat03/portmap"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
